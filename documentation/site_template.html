function filter(){const s=strings[lang],query=el('search').value.trim().toLocaleLowerCase(),tool=el('toolFilter').value;const cards=[];Object.entries(catalogData).forEach(([key,rows])=>{if(tool&&key!==tool)return;rows.forEach(r=>{if(query&&!JSON.stringify(r).toLocaleLowerCase().includes(query))return;const c=node('article','card');c.append(node('span','tag',gated.has(r.id)?s.gated:s.conditional),node('h3','',r.id+' — '+r[lang]),node('p','',tools[key][lang==='ar'?1:0]));if(r.formula)c.append(node('code','formula',r.formula));if(r.roles)c.append(node('p','',r.roles.join(' · ')));if(r.interpretation){const d=r.interpretation[lang];c.append(node('p','',d.meaning),node('p','',d.units+' · '+d.range),node('p','',d.caution));if(r.interpretation.educational_examples)c.append(node('p','',r.interpretation.educational_examples[lang]));}if(r.citation)c.append(node('p','',r.citation));cards.push(c);});});el('catalog').replaceChildren(...cards);el('count').textContent=cards.length+' '+s.found;}

el('methodTotal').textContent=Object.values(catalogData).reduce((count,rows)=>count+rows.length,0);
el('language').addEventListener('click',()=>{lang=lang==='ar'?'en':'ar';render();accessibleLabels();});el('search').addEventListener('input',filter);el('toolFilter').addEventListener('change',filter);render();accessibleLabels();
</script></body></html>
