[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atiaf"
version = "1.0.2.dev1"
description = "ATIAF (أطياف) — Advanced Thematic Imagery Analysis Framework"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Ahmad Ibrahim", email = "ahmadibrahim.geo@gmail.com" }
]
keywords = [
    "remote-sensing",
    "gis",
    "arcgis-pro",
    "qgis",
    "satellite-imagery",
    "landsat",
    "sentinel",
    "aster",
    "ndvi",
    "surface-temperature",
    "bilingual"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: GIS",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Natural Language :: Arabic",
    "Natural Language :: English"
]
dependencies = [
    "numpy>=1.22.0",
    "rasterio>=1.3.0",
    "shapely>=2.0.0",
    "pyproj>=3.3.0"
]

[project.optional-dependencies]
full = [
    "geopandas>=0.12.0",
    "matplotlib>=3.5.0",
    "scipy>=1.8.0"
]
test = [
    "pytest>=7.0.0"
]

[project.scripts]
atiaf-verify = "atiaf_core.cli:main"

[project.urls]
Homepage = "https://github.com/ahmadibrahim4geo/ATIAF"
Documentation = "https://github.com/ahmadibrahim4geo/ATIAF/tree/main/documentation"
Repository = "https://github.com/ahmadibrahim4geo/ATIAF.git"
Issues = "https://github.com/ahmadibrahim4geo/ATIAF/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["atiaf_core*"]

[tool.setuptools.package-data]
atiaf_core = ["data/*.json"]
