name: Documentation structure
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Markdown/JSON package (not GIS runtime)
        run: python tools/validate_package.py
